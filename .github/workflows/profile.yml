name: update profile

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.gtpl
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate README
        uses: muesli/readme-scribe@d2f6ab32d6b9f5b59941fe782d6c7e6499a37fe4 # master
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_README_TOKEN }}
        with:
          template: README.gtpl
          writeTo: README.md

      - name: Commit README
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update generated README"
          file_pattern: README.md

      - name: Generate metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.PROFILE_README_TOKEN }}
          filename: github-metrics.svg
          base: ""
          config_timezone: Europe/London
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
