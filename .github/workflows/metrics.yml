name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"     # rebuilds once a day - change if you like
  workflow_dispatch:        # lets you trigger it by hand from the Actions tab
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PROFILE_README_TOKEN }}
          filename: github-metrics.svg
