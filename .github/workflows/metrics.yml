name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"     # rebuilds once a day - change if you like
  workflow_dispatch:        # lets you trigger it by hand from the Actions tab
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PROFILE_README_TOKEN }}
          filename: github-metrics.svg
          # base: header, activity, community, repositories, metadata  <- these 5 are already the default, listed for clarity
          base_indepth: yes        # more accurate commit/PR/issue counts (costs extra API calls)
          plugin_isocalendar: yes  # the 3D isometric contributions calendar
          plugin_gists: yes        # gists count/files/comments box
