name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"     # rebuilds once a day
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PROFILE_README_TOKEN }}
          filename: github-metrics.svg
          base_indepth: yes
          plugin_isocalendar: yes
          plugin_gists: yes
          config_padding: 0, 20 + 15%
